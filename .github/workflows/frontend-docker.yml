name: Build and Push Frontend Docker Image

"on":
    push:
        tags:
            - "v*.*.*"
        paths:
            - "frontend/**"
            - ".github/workflows/frontend-docker.yml"

    workflow_dispatch:
        inputs:
            release_tag:
                description: "Existing Git tag to build, for example v1.2.3"
                required: true
                type: string

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
    build-and-push:
        name: Build and Push Docker Image
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  # For manual runs, check out the supplied tag instead of the
                  # branch selected in the GitHub workflow dialog.
                  ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
                  fetch-depth: 0

            - name: Validate manually supplied tag
              if: github.event_name == 'workflow_dispatch'
              env:
                  RELEASE_TAG: ${{ inputs.release_tag }}
              run: |
                  if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "::error::Tag must use the format v1.2.3"
                    exit 1
                  fi

                  if ! git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"; then
                    echo "::error::Git tag '$RELEASE_TAG' does not exist"
                    exit 1
                  fi

                  echo "Building existing Git tag: $RELEASE_TAG"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      # Tags generated during a normal Git tag push.
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}

                      # Tags generated when the workflow is started manually.
                      type=semver,pattern={{version}},value=${{ inputs.release_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
                      type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
                      type=semver,pattern={{major}},value=${{ inputs.release_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

                      # Also publish a tag tied to the exact commit.
                      type=sha,format=short

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: ./frontend
                  file: ./frontend/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
